# Accessibility and quality checks on every page in the sitemap: axe-core (WCAG 2.2 AA) in light and dark mode and at
# 320 px, keyboard tests, HTML validation, internal links and Lighthouse budgets.
name: Accessibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Playwright and axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Playwright and axe
        run: npx playwright test

      - name: Lighthouse budgets
        run: npm run lighthouse

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Nu HTML Checker
        run: docker run --rm -v "$PWD/public:/site:ro" ghcr.io/validator/validator:latest vnu --skip-non-html /site

  links:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links between pages
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --root-dir "${{ github.workspace }}/public" --index-files index.html 'public/**/*.html'
          fail: true
