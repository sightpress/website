customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
  - pattern: '**/*.md'
    headers:
      - key: Content-Type
        value: text/markdown; charset=utf-8
  - pattern: 'blog/feed.xml'
    headers:
      - key: Content-Type
        value: application/atom+xml; charset=utf-8
  - pattern: 'brand/**'
    headers:
      - key: Cache-Control
        value: public, max-age=604800
  - pattern: 'assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
